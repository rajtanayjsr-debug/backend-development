<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POST Data Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Student Form</h1>

    <form action="/submit" method="POST">

        <label for="name">Name:</label>
        <input
            type="text"
            id="name"
            name="name"
            required
        >

        <label for="course">Course:</label>
        <input
            type="text"
            id="course"
            name="course"
            required
        >

        <button type="submit">
            Submit
        </button>

    </form>

</body>
</html>
