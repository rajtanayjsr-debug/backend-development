<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tailwind Responsive Page</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <!-- Navbar -->
  <nav class="bg-gray-900 text-white">

    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">

      <span class="text-xl font-bold">
        MySite
      </span>

      <ul class="flex gap-6">

        <li>
          <a href="#" class="hover:text-gray-300">Home</a>
        </li>

        <li>
          <a href="#" class="hover:text-gray-300">About</a>
        </li>

        <li>
          <a href="#" class="hover:text-gray-300">Services</a>
        </li>

        <li>
          <a href="#" class="hover:text-gray-300">Contact</a>
        </li>

      </ul>

    </div>

  </nav>


  <!-- Hero Section -->
  <section
    class="max-w-6xl mx-auto px-4 py-16 flex flex-col lg:flex-row items-center gap-12"
  >

    <!-- Left Side -->
    <div class="lg:w-1/2">

      <h1 class="text-4xl lg:text-5xl font-bold text-gray-900 mb-6">
        Welcome to MySite
      </h1>

      <p class="text-lg text-gray-600 mb-8 leading-relaxed">
        Tailwind lets you build custom designs by composing utility classes.
        Every style is right here in the HTML — no separate CSS file needed.
      </p>

      <div class="flex gap-4">

        <a
          href="#"
          class="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700"
        >
          Get Started
        </a>

        <a
          href="#"
          class="border-2 border-gray-900 text-gray-900 px-6 py-3 rounded-lg font-semibold hover:bg-gray-900 hover:text-white"
        >
          Learn More
        </a>

      </div>

    </div>


    <!-- Right Side -->
    <div class="lg:w-1/2">

      <img
        src="https://via.placeholder.com/500x300"
        class="w-full rounded-xl shadow-lg"
        alt="Hero Image"
      >

    </div>

  </section>


  <h1 class="text-3xl p-8">
    More content here
  </h1>

</body>
</html>
