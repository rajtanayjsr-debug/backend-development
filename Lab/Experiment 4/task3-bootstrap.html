<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bootstrap Responsive Page</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body>

  <!-- Responsive Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

      <a class="navbar-brand" href="#">MySite</a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navMenu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">

        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="#">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">About</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">Services</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">Contact</a>
          </li>
        </ul>

      </div>
    </div>
  </nav>


  <!-- Hero: 2 columns on desktop, stacked on mobile -->
  <div class="container my-5">

    <div class="row align-items-center">

      <!-- Left Column -->
      <div class="col-lg-6 mb-4 mb-lg-0">

        <h1 class="display-4 fw-bold">
          Welcome to MySite
        </h1>

        <p class="lead text-muted">
          Bootstrap makes responsive design fast. The grid automatically
          adjusts from 1 column on phones to 2 columns on desktops.
        </p>

        <a href="#" class="btn btn-primary btn-lg">
          Get Started
        </a>

        <a href="#" class="btn btn-outline-secondary btn-lg ms-2">
          Learn More
        </a>

      </div>


      <!-- Right Column -->
      <div class="col-lg-6 text-center">

        <img
          src="https://via.placeholder.com/500x300"
          class="img-fluid rounded shadow"
          alt="Hero Image"
        >

      </div>

    </div>
  </div>


  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
