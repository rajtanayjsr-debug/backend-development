<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory - Fetch JSON</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Student Directory</h1>
        <h2>Part C - AJAX using Fetch API (JSON)</h2>

        <button id="loadJson">Load JSON Students</button>

        <p id="status" role="status">
            Click the button to load student data.
        </p>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Course</th>
                </tr>
            </thead>

            <tbody id="studentTable">
            </tbody>
        </table>

    </main>

    <script src="app.js"></script>

</body>
</html>
